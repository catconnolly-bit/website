<article class="writing-card">
  <a class="writing-card__media" href="{{ include.entry.url | relative_url }}">
    {% assign image_variant = site.data.image_variants[include.entry.image] %}
    {% assign card_image = image_variant.thumbnail | default: include.entry.image %}
    <img src="{{ card_image | relative_url }}" alt="" loading="lazy" decoding="async" width="600" height="556">
  </a>
  <div class="writing-card__body">
    <h3 class="writing-card__title">
      <a href="{{ include.entry.url | relative_url }}">{{ include.entry.title }}</a>
    </h3>
    {% if include.entry.excerpt %}
      <p class="writing-card__excerpt">{{ include.entry.excerpt }}</p>
    {% endif %}
  </div>
</article>
